apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
jobs:
  Checkout:
    steps:
      - name: checkout
        uses: cloudbees-io/checkout@v1
  Build:
    steps:
      - name: Build
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          ./gradlew build
    needs: Checkout
