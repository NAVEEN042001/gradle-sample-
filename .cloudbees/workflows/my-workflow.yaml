apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "master"
jobs:
  Checkout:
    steps:
      - name: Checkout Code
        uses: cloudbees-io/checkout@v1

  Build:
    steps:
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # Use the Java version compatible with your project

      - name: Build
        uses: actions/setup-java@v3
        run: |
          chmod +x ./gradlew
          ./gradlew build
    needs: Checkout

